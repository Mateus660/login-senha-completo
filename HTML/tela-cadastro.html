<!DOCTYPE html>
<html lang="Pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/estilo-tela.css">
    <title>Tela de cadastro</title>
</head>
<body>
    <main>
        <div  id="titulo"><h1>Faça seu cadastro aqui</h1><img src="../IMG/image-removebg-preview.png"  width="400" alt="" srcset=""></div>
        <section id="tela-de-cadastro"> 
            <h1>Cadastre-se</h1>
            <div id="inputs">
                <label for="nome" id="labelnome">Insira seu nome</label>
                <input type="text" name="nome" id="Nome" onkeyup="Nomecorr()">

                <label for="usuario" id="labelusuario">Nome de usuario</label>
                <input type="text" name="usuario" id="usuario">

                <label for="senha" id="labelsenha">Crie sua senha</label>
                <input type="text" name="senha" id="senha">

                <label for="comfirmsenha" id="labelconfirmsenha">Confirme sua senha</label>
                <input type="text" name="comfirmsenha" id="comfirmsenha">

                <button type="submit" onclick="iniciar()">Cadastrar</button>
                <button type="reset">Limpar</button>
            </div>
        </section>
    </main>
</body>
<script src="../JAVASCRIPT/cadastro.js"></script>
</html>
